<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 280" width="1000" height="280">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#03050d"/>
      <stop offset="0.6" stop-color="#071426"/>
      <stop offset="1" stop-color="#0a2540"/>
    </linearGradient>
    <radialGradient id="planet" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="0.6" stop-color="#0ea5e9"/>
      <stop offset="1" stop-color="#0c2a4d"/>
    </radialGradient>
    <linearGradient id="tail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00e5ff" stop-opacity="0"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <style>
    .s{fill:#fff;animation:tw 3s ease-in-out infinite}
    @keyframes tw{0%,100%{opacity:.15}50%{opacity:1}}
    .sh{animation:shoot 7s linear infinite;opacity:0}
    @keyframes shoot{0%{transform:translate(0,0);opacity:0}5%{opacity:1}25%{transform:translate(320px,160px);opacity:0}100%{transform:translate(320px,160px);opacity:0}}
    .name{font:700 54px 'Fira Code',Consolas,monospace;fill:#fff}
    .sub{font:500 20px 'Fira Code',Consolas,monospace;fill:#00e5ff}
  </style>
  <rect width="1000" height="280" fill="url(#bg)"/>
  <circle class="s" cx="60" cy="40" r="1.6" style="animation-delay:0s"/>
  <circle class="s" cx="140" cy="220" r="1.2" style="animation-delay:.6s"/>
  <circle class="s" cx="230" cy="70" r="1.8" style="animation-delay:1.2s"/>
  <circle class="s" cx="320" cy="250" r="1.4" style="animation-delay:1.8s"/>
  <circle class="s" cx="410" cy="30" r="1.2" style="animation-delay:2.4s"/>
  <circle class="s" cx="520" cy="240" r="1.8" style="animation-delay:.3s"/>
  <circle class="s" cx="600" cy="60" r="1.4" style="animation-delay:.9s"/>
  <circle class="s" cx="680" cy="200" r="1.2" style="animation-delay:1.5s"/>
  <circle class="s" cx="740" cy="30" r="1.8" style="animation-delay:2.1s"/>
  <circle class="s" cx="930" cy="40" r="1.4" style="animation-delay:2.7s"/>
  <circle class="s" cx="960" cy="230" r="1.6" style="animation-delay:.4s"/>
  <circle class="s" cx="30" cy="150" r="1.2" style="animation-delay:1.1s"/>
  <circle class="s" cx="470" cy="120" r="1" style="animation-delay:1.7s"/>
  <circle class="s" cx="870" cy="260" r="1.2" style="animation-delay:2.3s"/>
  <g transform="translate(80,20)"><g class="sh"><line x1="0" y1="0" x2="-90" y2="-45" stroke="url(#tail)" stroke-width="2"/></g></g>
  <g transform="translate(360,10)"><g class="sh" style="animation-delay:3.5s"><line x1="0" y1="0" x2="-90" y2="-45" stroke="url(#tail)" stroke-width="2"/></g></g>
  <g transform="translate(830,140)">
    <ellipse rx="105" ry="22" fill="none" stroke="#00e5ff" stroke-opacity=".35" stroke-width="3" transform="rotate(-20)"/>
    <circle r="52" fill="url(#planet)" filter="url(#glow)"/>
    <path d="M-100 -12 A105 22 0 0 0 100 12" fill="none" stroke="#00ff9d" stroke-opacity=".5" stroke-width="3" transform="rotate(-20)"/>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="10s" repeatCount="indefinite"/>
      <circle cx="95" cy="0" r="7" fill="#e2e8f0" filter="url(#glow)"/>
    </g>
  </g>
  <text class="name" x="60" y="130">Islam Abdelkarim</text>
  <text class="sub" x="62" y="175">Senior Backend Engineer  •  Laravel  •  Distributed Systems</text>
  <rect x="62" y="195" width="180" height="3" rx="1.5" fill="#00e5ff"/>
  <rect x="246" y="195" width="60" height="3" rx="1.5" fill="#00ff9d"/>
</svg>
